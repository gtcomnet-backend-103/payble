name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${SHORT_SHA}-$(date +%s)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${{ env.DOCKER_IMAGE }}:${TAG}" >> $GITHUB_OUTPUT
          echo "latest=${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: production
          tags: |
            ${{ steps.image-tag.outputs.image }}
            ${{ steps.image-tag.outputs.latest }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Pull the new image
            docker pull ${{ steps.image-tag.outputs.image }}
            docker tag ${{ steps.image-tag.outputs.image }} ${{ env.DOCKER_IMAGE }}:latest

            # Deploy
            cd ${{ vars.DEPLOY_PATH }}
            export DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
            docker compose -f docker-compose.prod.yml up -d --no-build
            docker image prune -f
